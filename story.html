<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>html,body{margin:0;height:100%;background:#1f1b18;overflow:hidden}canvas{display:block;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;margin:auto;position:absolute;inset:0}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>var CLIPS = window.CLIPS = {}; var PLACES = window.PLACES = {};</script>
<script src="engine.js"></script>
<script src="collage.js"></script>
<script src="kit2.js"></script>
<script src="cast.js"></script>

<script src="endings.js"></script>
<script src="board.js"></script>
<script src="places-family.js"></script>
<script src="places-city.js"></script>
<script src="places-meera.js"></script>
<script src="places-sunanda.js"></script>

<script src="groove.js"></script>
<script src="sound.js"></script>
<script>
(function () {
  var Q = new URLSearchParams(location.search), S = parseFloat(Q.get('s') || '1');
  var cv = document.getElementById('c'); cv.width = Math.round(1920 * S); cv.height = Math.round(1080 * S);
  var ctx = cv.getContext('2d');
  var DURS = { prologue: 15, 'wait-1': 4, 'wait-2': 4, 'c1-ban': 15, 'c1-build': 15, rewind: 3 };
  Agamoto.ROADS.forEach(function (r) { DURS['c2-' + r] = 15; DURS['end-' + r] = 12; });
  // 'place-<name>' previews one PLACES scene on its own (QC: node render.mjs place-<name> --road <road>)
  function place(id) { return /^place-/.test(id) ? PLACES[id.slice(6)] : null; }
  function dur(id) { var pl = place(id); return (SHOTS[id] && SHOTS[id].dur) || (CLIPS[id] && CLIPS[id].dur) || (pl && pl.dur) || DURS[id] || 4; }
  // HUD year for clip time t
  function yearAt(id, t) {
    var sh = SHOTS[id]; if (sh) { var sg = segAt(sh, t); return sg.year(t - sg.t0); }
    return clipYear(id, t);
  }
  function clipYear(id, t) {
    var d = dur(id), P = C.prog, k = CLIPS[id] || place(id);
    if (k && typeof k.year === 'function') return k.year(t);       // chapters and places declare their own year
    if (k && typeof k.year === 'number') return k.year;
    if (id === 'prologue' || id === 'wait-1') return 2026;
    if (id === 'wait-2') return 2027;
    if (/^c1-/.test(id)) return 2026 + C.ease(P(t, 1.5, 13.5));
    if (/^c2-/.test(id)) return 2027 + 3 * P(t, 1, 14);
    if (/^end-/.test(id)) return 2030 + 6 * C.easeOut(P(t, 0.05, 0.9));
    if (id === 'rewind') return 2036 - 10 * C.ease(P(t, 0.2, 2.8));
    return 2026;
  }
  function roadFor(id, roadId) {
    var m = id.match(/^(?:c2|end|mid)-(\w+-\w+)$/); if (m) return m[1];
    if (/^c1-/.test(id)) return id.slice(3) + '-retrain';
    if (/^home-/.test(id)) return id.slice(5) + '-retrain';
    if (id === 'wait-2' && roadId) return roadId.split('-')[0] + '-retrain';
    return roadId || 'build-retrain';
  }
  function placeholder(c, id, t, road) {
    C.use(c); c.fillStyle = C.PALETTE.cream; c.fillRect(0, 0, 1920, 1080);
    C.rect(360, 300, 1200, 420, C.PALETTE.paper, 3, { halftone: .4 });
    C.label('placeholder · ' + id, 960, 440, 72, C.PALETTE.saffron, 'center', 800);
    C.caption('This clip is still being made.', [], C.clamp(t / 2), 600);
    c.fillStyle = C.PALETTE.teal; c.fillRect(360, 760, 1200 * t / dur(id), 10);
  }
  // HUD: 'full' (the dashboard), 'year' (places and close-ups: a year chip only) or 'none'
  function hudMode(id, t) {
    var sh = SHOTS[id]; if (sh) { var sg = segAt(sh, t); return sg.hud ? sg.hud(t - sg.t0) : 'full'; }
    var k = CLIPS[id] || place(id); return k && k.hud ? (typeof k.hud === 'function' ? k.hud(t) : k.hud) : (place(id) ? 'year' : 'full');
  }
  function hud(c, id, t, road) {
    var y = yearAt(id, t), v = Agamoto.at(road, y), s0 = road.counters[2026], mode = hudMode(id, t);
    if (mode === 'none') return;
    C.use(c); c.save();
    // brand
    C.paper(C.torn(28, 24, 330, 70, 41, 3), C.PALETTE.paper, { lift: 4 });
    // the Eye: an almond with a saffron iris that slowly looks around
    var ex = 72, ey = 59, look = Math.sin(t * 1.3) * 4;
    c.save(); c.beginPath(); c.moveTo(ex - 30, ey); c.quadraticCurveTo(ex, ey - 26, ex + 30, ey); c.quadraticCurveTo(ex, ey + 26, ex - 30, ey); c.closePath();
    c.fillStyle = C.PALETTE.cream; c.fill(); c.lineWidth = 3.5; c.strokeStyle = C.PALETTE.tealDark; c.stroke(); c.clip();
    c.fillStyle = C.PALETTE.saffron; c.beginPath(); c.arc(ex + look, ey, 10.5, 0, 6.283); c.fill();
    c.fillStyle = C.PALETTE.ink; c.beginPath(); c.arc(ex + look, ey, 4.5, 0, 6.283); c.fill(); c.restore();
    C.label('Eye of Agamoto', 116, 48, 24, C.PALETTE.ink, 'left', 800);
    C.label('Vidya Classes', 116, 74, 19, C.PALETTE.inkSoft, 'left', 500);
    if (mode === 'year') {
      C.paper(C.torn(28, 958, 150, 66, 44, 3), 'rgba(251,245,232,0.94)', { lift: 4 });
      C.label(String(Math.round(y)), 103, 992, 44, C.PALETTE.ink, 'center', 800);
    } else {
    // counters
    var items = [['Students', Math.round(v.students).toLocaleString('en-IN'), v.students - s0.students, 20],
                 ['Teachers', Math.round(v.teachers), v.teachers - s0.teachers, 1],
                 ['Fees', '₹' + (Math.round(v.fees / 500) * 500).toLocaleString('en-IN'), s0.fees - v.fees, 400],
                 ['Results', Math.round(v.results), v.results - s0.results, 1]];
    C.paper(C.torn(28, 930, 760, 92, 43, 3), 'rgba(251,245,232,0.94)', { lift: 4 });
    C.label(String(Math.round(y)), 52, 976, 44, C.PALETTE.ink, 'left', 800);
    items.forEach(function (it, i) {
      var x = 170 + i * 152; C.label(it[0], x, 956, 18, C.PALETTE.inkSoft, 'left', 500);
      C.label(it[1], x, 990, 34, C.dirColor(it[2], it[3]), 'left', 800);
    });
    }
    // trust line
    c.font = 'italic 25px ' + C.FONTS.serif; var tl = Agamoto.futures() + ' futures · same luck · a fictional company · a rehearsal, not a prediction', tw = c.measureText(tl).width;
    c.fillStyle = 'rgba(31,27,24,0.78)'; c.fillRect(1892 - tw - 24, 1030, tw + 40, 40);
    c.fillStyle = '#f4ead7'; c.textAlign = 'right'; c.textBaseline = 'middle'; c.fillText(tl, 1898, 1051);
    c.restore();
  }
  /* ---------- shots: the board view wrapped around the impact clips ----------
     Each decision is taken in the boardroom; the camera pushes into the board's wall screen, the impact plays full
     frame (the school, then a family at home, and in 2036 the batch's futures), then pulls back out to the board.
     The screen shows the exact first/last frame of the clip it opens onto, so every join stays pixel-exact. */
  var SHOTS = {}, stills = {}, stillOrder = [];
  function segAt(sh, t) { for (var i = sh.segs.length - 1; i >= 0; i--) if (t >= sh.segs[i].t0) return sh.segs[i]; return sh.segs[0]; }
  function rkey(r) { return r.id + (r.custom ? '|' + r.custom.label + '|' + r.custom.consequence : ''); }
  function still(key, fn) {
    if (stills[key]) return stills[key];
    var k = document.createElement('canvas'); k.width = cv.width; k.height = cv.height; var x = k.getContext('2d');
    x.setTransform(S, 0, 0, S, 0, 0); x.fillStyle = '#f4ead7'; x.fillRect(0, 0, 1920, 1080); C.use(x); x.save(); fn(x); x.restore(); C.use(ctx);
    stills[key] = k; stillOrder.push(key); if (stillOrder.length > 8) delete stills[stillOrder.shift()];
    return k;
  }
  function clipStill(clip, t) { return function (r) { return still(clip + '@' + t + '@' + rkey(r), function (x) { CLIPS[clip].draw(x, t, r); }); }; }
  function homeStill(stage, tl, len) { return function (r) { return still('home' + stage + '@' + tl + '@' + rkey(r), function (x) { HOME.draw(x, { road: r, stage: stage }, tl, len); }); }; }
  function batchStill(tl, len) { return function (r) { return still('batch@' + tl + '@' + rkey(r), function (x) { BATCH.draw(x, { road: r }, tl, len); }); }; }
  function capIn(c, text, tl, len, y) { if (!text || tl < 0.45 || tl > len - 0.45) return; c.save(); c.globalAlpha = C.clamp(Math.min((tl - 0.45) / 0.25, (len - 0.45 - tl) / 0.25)); C.use(c); C.caption(text, [], C.prog(tl, 0.5, Math.max(0.9, len - 0.9)), y || 990, { size: 44, x: 1330 }); c.restore(); }
  function tornWipe(c, img, x0) {
    c.save(); c.beginPath(); c.moveTo(-10, -10); c.lineTo(x0, -10);
    for (var y = 0; y <= 1100; y += 36) c.lineTo(x0 + ((y * 7919) % 23) - 11, y);
    c.lineTo(-10, 1100); c.closePath(); c.shadowColor = 'rgba(20,12,6,0.45)'; c.shadowBlur = 24; c.shadowOffsetX = 8; c.fillStyle = '#fbf5e8'; c.fill(); c.shadowColor = 'transparent'; c.clip();
    c.drawImage(img, 0, 0, 1920, 1080); c.restore();
  }
  function evOf(k, r) { try { return k && k.events ? (typeof k.events === 'function' ? k.events(r) : k.events) : []; } catch (e) { console.error(e); return []; } }
  function segInner(clip, from, len) {
    return { len: len, draw: function (c, tl, r) { CLIPS[clip].draw(c, from + tl, r); }, year: function (tl) { return clipYear(clip, from + tl); },
      hud: function (tl) { var k = CLIPS[clip]; return k && k.hud ? (typeof k.hud === 'function' ? k.hud(from + tl) : k.hud) : 'full'; },
      events: function (r) { return evOf(CLIPS[clip], r).filter(function (e) { return e[0] >= from - 0.01 && e[0] < from + len; }).map(function (e) { return [e[0] - from].concat(e.slice(1)); }); } };
  }
  // one of the story's places (places-*.js), entered with the torn wipe from the shot before
  function placeStill(name, t) { return function (r) { return still('place-' + name + '@' + t + '@' + rkey(r), function (x) { CHAPTERS.placeOf(name).draw(x, t, r); }); }; }
  function segPlace(name, wipeFrom) {
    var pl = CHAPTERS.placeOf(name), len = Math.round(pl.dur / C.BEAT) * C.BEAT;
    return { len: len, cutSfx: wipeFrom ? 'rip' : 'swish', year: function (tl) { return typeof pl.year === 'function' ? pl.year(tl) : pl.year; }, hud: function () { return 'year'; },
      events: function (r) { return evOf(CHAPTERS.placeOf(name), r); },
      draw: function (c, tl, r) { CHAPTERS.placeOf(name).draw(c, tl, r); C.use(c); var w = C.ease(C.prog(tl, 0, 0.8)); if (wipeFrom && w < 1) tornWipe(c, wipeFrom(r), 1940 * (1 - w)); } };
  }
  // o: {agenda, year, cards(r), age(tl), push: {at, to(r)}, pull: {from(r)}, cap}
  function segBoard(len, o) {
    return { len: len, year: function () { return o.year; },
      events: function () { var ev = []; if (o.pull) ev.push([0.05, 'whooshOut']); if (o.push) ev.push([o.push.at - 0.2, 'whooshIn']); if (o.cards && o.age) ev.push([0.62, 'clonk']); return ev; },
      draw: function (c, tl, r) {
      var cfg = { road: r, year: o.year, agenda: o.agenda, cards: o.cards ? o.cards(r) : [], cardAge: o.age ? o.age(tl) : null };
      var f = 0, img = null, a = 0;
      if (o.push) { img = o.push.to(r); a = C.prog(tl, o.push.at - 0.3, o.push.at); f = C.prog(tl, o.push.at, len); }
      if (o.pull) { img = o.pull.from(r); f = 1 - C.prog(tl, 0, len - 0.8); a = 1 - C.prog(tl, len - 0.7, len - 0.3); }
      C.withCam(BOARD.zoomCam(f), function () {
        BOARD.draw(c, cfg, tl, len);
        if (img && a > 0) { var R = BOARD.SCREEN; c.save(); c.globalAlpha = a; c.drawImage(img, R.x, R.y, R.w, R.h); c.restore(); }
      });
      capIn(c, o.cap, tl, len, 975);
    } };
  }
  function segHome(stage, len, wipeFrom) {
    return { len: len, year: function () { return stage === 1 ? 2027 : 2030; }, draw: function (c, tl, r) {
      HOME.draw(c, { road: r, stage: stage }, tl, len);
      var w = C.ease(C.prog(tl, 0, 0.8)); if (wipeFrom && w < 1) tornWipe(c, wipeFrom(r), 1940 * (1 - w));
    } };
  }
  function segBatch(len, wipeFrom) {
    return { len: len, cutSfx: 'rip', year: function () { return 2036; }, events: function () { return [[1.25, 'pop'], [1.875, 'popLow', 1], [2.5, 'popLow', 2], [3.125, 'popLow', 3]]; }, draw: function (c, tl, r) {
      BATCH.draw(c, { road: r }, tl, len);
      var w = C.ease(C.prog(tl, 0, 0.8)); if (wipeFrom && w < 1) tornWipe(c, wipeFrom(r), 1940 * (1 - w));
    } };
  }
  function segFlash(len, from) {
    return { len: len, year: function () { return 2030; }, events: function () { return [[0, 'ding']]; }, draw: function (c, tl, r) { c.drawImage(from(r), 0, 0, 1920, 1080); C.use(c); C.flash(0.95 * tl / len); } };
  }
  function shot(id, segs) { var d = 0; segs.forEach(function (sg) { sg.t0 = d; d += sg.len; }); SHOTS[id] = { segs: segs, dur: Math.round(d * 1000) / 1000 }; }
  // on the 96 bpm grid: pushes and pulls are 4 beats, the batch 12 (story v3: the places replace the generic home scenes)
  var BATCH_LEN = 7.5, PUSH = 2.5, PULL = 2.5;
  function c1Card(r) { return [r.c1]; }
  function bothCards(r) { return [r.c1, r.c2]; }
  shot('prologue', [segInner('prologue', 0, 15), segBoard(PULL, { agenda: 0, year: 2026, pull: { from: clipStill('prologue', 15) }, cap: 'Upstairs, the *board* meets.' })]);
  shot('wait-1', [segBoard(4, { agenda: 0, year: 2026 })]);
  ['ban', 'build'].forEach(function (k) {
    shot('c1-' + k, [
      segBoard(PUSH, { agenda: 0, year: 2026, cards: c1Card, age: function (tl) { return [tl - 0.6]; }, push: { at: 1.25, to: clipStill('c1-' + k, 0) } }),
      segInner('c1-' + k, 0, 15),
      segPlace('bedroom', clipStill('c1-' + k, 15)),
      segBoard(PULL, { agenda: 1, year: 2027, cards: c1Card, pull: { from: placeStill('bedroom', CHAPTERS.placeOf('bedroom').dur) }, cap: 'Back to the *board*. 2027.' })]);
  });
  shot('wait-2', [segBoard(4, { agenda: 1, year: 2027, cards: c1Card })]);
  Agamoto.ROADS.forEach(function (rd) {
    shot('c2-' + rd, [
      segBoard(PUSH, { agenda: 1, year: 2027, cards: bothCards, age: function (tl) { return [9, tl - 0.6]; }, push: { at: 1.25, to: clipStill('c2-' + rd, 0) } }),
      segInner('c2-' + rd, 0, CLIPS['c2-' + rd].dur),          // 2027 classroom → staff room → 2028 shop → 2029 street → 2030 results
      segInner('mid-' + rd, 0, CLIPS['mid-' + rd].dur)]);      // 2032 Meera → 2034 Sunanda's office
    shot('end-' + rd, [
      segFlash(0.15, clipStill('mid-' + rd, CLIPS['mid-' + rd].dur)),
      segInner('end-' + rd, 0.12, 11.88),
      segBatch(BATCH_LEN, clipStill('end-' + rd, 12)),
      segBoard(PULL, { agenda: 2, year: 2036, cards: bothCards, pull: { from: batchStill(BATCH_LEN, BATCH_LEN) }, cap: 'Back to the *board*: the 2036 report.' })]);
  });
  shot('rewind', [
    segBoard(1.1, { agenda: 2, year: 2036, cards: bothCards, push: { at: 0.35, to: batchStill(BATCH_LEN, BATCH_LEN) } }),
    segInner('rewind', 0, 3),
    segBoard(1.6, { agenda: 0, year: 2026, pull: { from: clipStill('rewind', 3) } })]);
  // a road Claude designed: its 2036 film and the batch (played live on the home page)
  shot('film-custom', [segInner('end-build-retrain', 0, 12), segBatch(BATCH_LEN, clipStill('end-build-retrain', 12))]);

  // the shot's sound events: a cut sound at each segment boundary + every segment's own events
  function shotEvents(id, road) {
    var ev = []; SHOTS[id].segs.forEach(function (sg, i) { if (i) ev.push([sg.t0, sg.cutSfx || 'swish']); (sg.events ? sg.events(road) : []).forEach(function (e) { ev.push([sg.t0 + e[0]].concat(e.slice(1))); }); });
    return ev;
  }
  function frame(id, t, roadId) {
    var road = (roadId && typeof roadId === 'object') ? roadId : Agamoto.road(roadFor(id, roadId)), d = dur(id); t = Math.max(0, Math.min(d, t));
    ctx.setTransform(S, 0, 0, S, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#f4ead7'; ctx.fillRect(0, 0, 1920, 1080);
    C.use(ctx);
    try {
      var sh = SHOTS[id], pl = place(id);
      if (pl && !CLIPS[id]) { ctx.save(); pl.draw(ctx, t, road); ctx.restore(); }
      else if (sh) { var sg = segAt(sh, t); ctx.save(); sg.draw(ctx, Math.min(sg.len, t - sg.t0), road); ctx.restore(); }
      else if (CLIPS[id]) { ctx.save(); CLIPS[id].draw(ctx, t, road); ctx.restore(); } else placeholder(ctx, id, t, road);
    }
    catch (e) { ctx.restore && ctx.restore(); placeholder(ctx, id + ' (error: ' + e.message + ')', t, road); console.error(e); }
    ctx.setTransform(S, 0, 0, S, 0, 0); C.use(ctx);
    C.vignette(0.42); if (!Q.get('nograin')) C.grain(t, 0.45); hud(ctx, id, t, road);
  }
  var ready = fetch('company.json').then(function (r) { return r.json(); }).then(function (co) { Agamoto.init(co); return document.fonts.load('italic 40px "Instrument Serif"'); })
    .then(function () { return Promise.all([document.fonts.load('700 30px "Barlow Condensed"'), document.fonts.load('800 30px "Barlow Condensed"'), document.fonts.load('500 30px "Barlow Condensed"'), document.fonts.load('30px "Tiro Devanagari Hindi"'), C.loadPhotos()]); });
  // the score for a clip or shot: groove.js on the beat grid + one sound per visible event (render.mjs bakes it into the MP4)
  function soundSpec(id, roadId) { var road = (roadId && typeof roadId === 'object') ? roadId : Agamoto.road(roadFor(id, roadId)); return SOUND.spec(id, road, dur(id), SHOTS[id] ? shotEvents(id, road) : null); }
  function score(id, roadId) { var sp = soundSpec(id, roadId); return function (ac) { buildGroove(ac, sp); }; }
  window.AGAMOTO = { ready: ready, dur: dur, frame: frame, canvas: cv, yearAt: yearAt, roadFor: roadFor, soundSpec: soundSpec, score: score };

  // ---- live playback ----
  var clipQ = Q.get('clip'), roadQ = Q.get('road') || 'build-retrain';
  ready.then(function () {
    if (Q.get('static')) return;
    // film mode (story.html#film, framed by the home page): plays the 2036 film for a road Claude designed
    if (location.hash.indexOf('#film') === 0) {
      var film = { road: null, t0: 0 };
      addEventListener('message', function (e) {
        var d = e.data; if (e.origin !== location.origin || !d || d.type !== 'agamoto:film') return;
        try { film.road = Agamoto.customRoad(d.c1, d.design); film.t0 = performance.now(); } catch (err) { console.error(err); }
      });
      cv.addEventListener('click', function () { if (film.road) film.t0 = performance.now(); });
      (function loop() {
        if (film.road) frame('film-custom', Math.min(dur('film-custom'), (performance.now() - film.t0) / 1000), film.road);
        else { ctx.setTransform(S, 0, 0, S, 0, 0); ctx.fillStyle = '#1f1b18'; ctx.fillRect(0, 0, 1920, 1080); C.use(ctx); C.label('Your 2036 plays here', 960, 540, 48, '#cdbfa5', 'center', 700); }
        requestAnimationFrame(loop);
      })();
      try { parent.postMessage({ type: 'agamoto:film-ready' }, location.origin); } catch (err) {}
      return;
    }
    if (clipQ) { var t0 = performance.now(); (function loop() { var t = ((performance.now() - t0) / 1000) % dur(clipQ); frame(clipQ, t, roadQ); requestAnimationFrame(loop); })(); return; }
    // whole story live: prologue → wait-1 (1/2, Enter) → c1 → wait-2 → c2 → end → (R rewinds to the other first choice)
    var st = { id: 'prologue', t0: performance.now(), c1: 'build', c2: 'retrain', pick: null, stage: 0 };
    function go(id) { st.id = id; st.t0 = performance.now(); }
    function road() { return st.c1 + '-' + st.c2; }
    function lock() {
      if (st.id === 'wait-1') { st.c1 = st.pick === '1' ? 'ban' : 'build'; go('c1-' + st.c1); }
      else if (st.id === 'wait-2') { st.c2 = st.pick === '1' ? 'cut' : 'retrain'; go('c2-' + road()); }
      st.pick = null;
    }
    function rewind() { st.rw = road(); go('rewind'); }
    window.AGAMOTO.live = st;
    addEventListener('keydown', function (e) {
      if (e.key === '1' || e.key === '2') st.pick = e.key;
      if (e.key === 'Enter') lock();
      if (e.key === 'r' || e.key === 'R') rewind();
    });
    // click a card to choose it; click after 2036 to rewind
    cv.addEventListener('click', function (e) {
      var r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 1920, y = (e.clientY - r.top) / r.height * 1080;
      if (st.id === 'wait-1' || st.id === 'wait-2') {
        for (var i = 0; i < 2; i++) if (x >= 520 + i * 460 && x <= 940 + i * 460 && y >= 740 && y <= 900) { st.pick = String(i + 1); lock(); return; }
      } else if (/^end-/.test(st.id) && (performance.now() - st.t0) / 1000 >= dur(st.id)) rewind();
    });
    function wrap(c, text, x, y, maxW, lh) {
      var words = text.split(' '), line = '', lines = [];
      words.forEach(function (w) { var t = line ? line + ' ' + w : w; if (c.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; });
